name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies & Build NestJS
        run: |
          npm install
          npm run build

      - name: Prepare Code folder to send
        run: |
          mkdir -p .github/temp_build/Code
          cp -r dist package*.json tsconfig.json Dockerfile .github/temp_build/Code/

      - name: Deploy to VPS
        run: |
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
          source: ".github/temp_build/"
          target: "/home/root/backend"

      - name: SSH and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd /home/root/backend
            docker compose down
            docker compose up --build -d
