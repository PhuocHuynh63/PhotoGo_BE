name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies & Build NestJS
        run: |
          npm install
          npm run build

      - name: Prepare Code folder to send
        run: |
          mkdir -p .github/temp_build/Code
          cp -r dist package*.json tsconfig.json Dockerfile .github/temp_build/Code/

      - name: Copy Code to VPS
        run: |
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          scp -o StrictHostKeyChecking=no -i private_key.pem -r .github/temp_build/Code/* ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/root/backend
          rm -f private_key.pem

      - name: SSH and restart backend
        run: |
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /root/backend &&
            docker build -t photogo-nestjs:latest . &&
            docker stop photogo-nestjs || true &&
            docker rm photogo-nestjs || true &&
            docker run -d --name photogo-nestjs -p 3000:3000 --restart always photogo-nestjs:latest
          "
          rm -f private_key.pem
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
