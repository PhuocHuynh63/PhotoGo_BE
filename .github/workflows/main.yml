name: Deploy NestJS to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install backend dependencies and build
        working-directory: backend
        run: |
          npm install
          npm run build

      - name: Prepare backend deploy folder
        run: |
          mkdir -p deploy_folder
          cp -r backend/dist backend/package.json backend/package-lock.json backend/tsconfig.json backend/docker-compose.yml deploy_folder/

      - name: Rsync code to VPS
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" deploy_folder/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/backend
          rm -f private_key.pem

      - name: Restart backend via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/backend
            docker-compose down
            docker-compose up -d --build
