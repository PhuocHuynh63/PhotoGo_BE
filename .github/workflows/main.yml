name: Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies & Build NestJS
        run: |
          npm install
          npm run build

      - name: Prepare Code folder to send
        run: |
          mkdir -p .github/temp_build/Code
          cp -r dist package-lock.json package.json Dockerfile .github/temp_build/Code/
          cp docker-compose.yml .github/temp_build/

      - name: Copy Code to VPS
        run: |
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          tar -czf code.tar.gz -C .github/temp_build/Code .
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p /home/root/backend/Code &&
            rm -rf /home/root/backend/Code/dist
          "
          scp -o StrictHostKeyChecking=no -i private_key.pem code.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/root/backend/Code/
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /home/root/backend/Code &&
            tar -xzf code.tar.gz &&
            rm code.tar.gz
          "
          scp -o StrictHostKeyChecking=no -i private_key.pem .github/temp_build/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/root/backend/
          rm -f private_key.pem

      - name: SSH and restart backend
        run: |
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /home/root/backend &&
            docker-compose down &&
            timeout 300 docker-compose up -d --build || echo 'Build timed out after 5 minutes'
          "
          rm -f private_key.pem
        env:
          VPS_PRIVATE_KEY: ${{ secrets.VPS_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
