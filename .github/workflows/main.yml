name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies & Build NestJS
        run: |
          npm install
          npm run build

      - name: Prepare code to send
        run: |
          mkdir -p .github/temp_build/Code
          cp -r dist package*.json tsconfig.json Dockerfile .github/temp_build/Code/

      - name: Copy build to VPS
        run: |
          echo "${{ secrets.VPS_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" .github/temp_build/Code/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/backend
          rm -f private_key.pem

      - name: SSH and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/backend
            docker-compose down
            docker-compose up --build -d
